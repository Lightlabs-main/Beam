[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
network = "monad"
optimizer = true
optimizer_runs = 10000
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1024

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[lint]
lint_on_build = false
